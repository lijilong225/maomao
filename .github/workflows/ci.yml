name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  GO_VERSION: 1.26.0
  NDK_VERSION: 28.2.13676358
  # Must match the golang.org/x/mobile version in core/go.mod.
  GOMOBILE_VERSION: v0.0.0-20260821190718-4776eadac327

jobs:
  core:
    name: core (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: go vet
        working-directory: core
        run: go vet -tags "with_gvisor cmfa" ./...

      - name: go test
        working-directory: core
        run: go test -tags "with_gvisor cmfa" ./...

  app:
    name: app (flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze

      - name: flutter test
        working-directory: app
        run: flutter test

  apk:
    name: debug apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}

      - name: Build core AAR
        working-directory: core
        run: make android ANDROID_SDK="$ANDROID_HOME" NDK_VERSION="$NDK_VERSION"

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: maomao-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: debug windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build core sidecar
        working-directory: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../app/windows/libs | Out-Null
          $version = go list -m -f '{{.Version}}' github.com/metacubex/mihomo
          go build -tags "with_gvisor" -trimpath `
            -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=$version" `
            -o ../app/windows/libs/maomao-core.exe ./cmd/maomao-core

      - name: Build Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --debug

      - uses: actions/upload-artifact@v4
        with:
          name: maomao-debug-windows
          path: app/build/windows/x64/runner/Debug
          if-no-files-found: error

  macos:
    name: debug macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build core sidecar
        working-directory: core
        run: make macos

      - name: Build macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --debug

      - uses: actions/upload-artifact@v4
        with:
          name: maomao-debug-macos
          path: app/build/macos/Build/Products/Debug/maomao.app
          if-no-files-found: error
