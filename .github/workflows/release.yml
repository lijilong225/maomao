name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish as
        required: true

env:
  FLUTTER_VERSION: 3.47.1
  GO_VERSION: 1.26.0
  NDK_VERSION: 28.2.13676358
  # Must match the golang.org/x/mobile version in core/go.mod.
  GOMOBILE_VERSION: v0.0.0-20260821190718-4776eadac327

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}

      - name: Build core AAR
        working-directory: core
        run: make android ANDROID_SDK="$ANDROID_HOME" NDK_VERSION="$NDK_VERSION"

      - name: Decode keystore
        working-directory: app/android
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build split APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Verify signature
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app-*-release.apk; do
            echo "== $f"
            "$apksigner" verify --print-certs "$f" | grep -i 'certificate DN'
          done

      - name: Rename artifacts
        working-directory: app/build/app/outputs/flutter-apk
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "maomao-${TAG}-${abi}.apk"
          done
          ls -1 maomao-*.apk

      - name: Remove signing material
        if: always()
        working-directory: app/android
        run: rm -f upload-keystore.jks key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: app/build/app/outputs/flutter-apk/maomao-*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build core sidecar
        working-directory: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../app/windows/libs | Out-Null
          $version = go list -m -f '{{.Version}}' github.com/metacubex/mihomo
          go build -tags "with_gvisor" -trimpath `
            -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=$version" `
            -o ../app/windows/libs/maomao-core.exe ./cmd/maomao-core

      - name: Build Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package artifact
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath "maomao-$env:TAG-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: maomao-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/maomao-*
